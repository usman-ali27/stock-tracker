[build]
  command = "npm run build"
  publish = ".next"
  environment = { NODE_VERSION = "18" }

# Redirect rule for Next.js client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Add the Next.js plugin for better compatibility
[[plugins]]
  package = "@netlify/plugin-nextjs"